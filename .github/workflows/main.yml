name: CI/CD

on:
  push:
    branches:
      - main
      - first-iteration
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t usachevks/parcel-tracker:test .

      - name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: usachevks
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag usachevks/parcel-tracker:test usachevks/parcel-tracker:${GITHUB_REF_NAME}
          docker tag usachevks/parcel-tracker:test usachevks/parcel-tracker:latest
          docker push usachevks/parcel-tracker:${GITHUB_REF_NAME}
          docker push usachevks/parcel-tracker:latest