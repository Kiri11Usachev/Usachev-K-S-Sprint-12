name: CI/CD

on:
  push:
    branches:
      - main
      - first-iteration
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image or publish on tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker build \
              -t "$DOCKERHUB_USERNAME/parcel-tracker:$GITHUB_REF_NAME" \
              -t "$DOCKERHUB_USERNAME/parcel-tracker:latest" \
              .

            docker push "$DOCKERHUB_USERNAME/parcel-tracker:$GITHUB_REF_NAME"
            docker push "$DOCKERHUB_USERNAME/parcel-tracker:latest"
          else
            docker build -t parcel-tracker:test .
            echo "This is not a tag. DockerHub publishing is not required."
          fi
